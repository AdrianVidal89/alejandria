# nginx delante de Alejandria.
#
# Su único trabajo que de verdad importa: entregar los PDFs. Django responde con
# la cabecera X-Accel-Redirect y nginx lee el fichero del disco y lo manda al
# navegador. Así un PDF de 200 MB no pasa por Python y la memoria del contenedor
# web se mantiene plana haga lo que haga el usuario.

upstream alejandria {
    server web:8000;
    keepalive 4;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 512M;   # subir escaneos grandes por la web
    client_body_buffer_size 128k;
    client_body_temp_path /tmp/subidas;

    # Estáticos: los sirve nginx directamente, comprimidos por whitenoise.
    location /estaticos/ {
        alias /estaticos/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Entrega interna de documentos. No es accesible desde fuera: solo Django
    # puede redirigir aquí.
    location /interno/ {
        internal;
        alias /biblioteca/;
        add_header Cache-Control "private, max-age=0";
    }

    location / {
        proxy_pass http://alejandria;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_request_buffering on;   # el cuerpo entero a disco antes de Django
    }
}
