# nginx delante de Alejandria.
#
# Hace de puerta de entrada y poco más. Los documentos los entrega la propia
# aplicación: Django los manda a trozos, sin cargarlos en memoria (medido: servir
# un PDF de 300 MB sube el consumo de 70 a 72 MB y vuelve a bajar).
#
# Antes esto lo hacía nginx con X-Accel-Redirect, que ahorra algo de CPU, pero
# exige que nginx pueda LEER la carpeta de documentos. En el NAS esa carpeta es
# 'drwxrwx--- adrian:remote_access' y nginx trabaja con otro usuario, así que
# devolvía 403 en cada documento. No compensa: se deja la entrega en Django.
#
# Si algún día los permisos de la carpeta lo permiten y se quiere recuperar,
# basta con descomentar el bloque 'location /interno/' de abajo, volver a montar
# la biblioteca en este contenedor y poner ALEJANDRIA_ACCEL=/interno/ en el
# fichero de configuración.

upstream alejandria {
    server web:8000;
    keepalive 4;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 512M;   # subir escaneos grandes por la web
    client_body_buffer_size 128k;
    client_body_temp_path /tmp/subidas;

    # Los estáticos van dentro de la imagen y los sirve whitenoise, ya
    # comprimidos y con sus cabeceras de caché. nginx solo los deja pasar.
    location /estaticos/ {
        proxy_pass http://alejandria;
        proxy_set_header Host $host;
        access_log off;
    }

    # Entrega interna de documentos (desactivada, ver la cabecera del fichero).
    # location /interno/ {
    #     internal;
    #     alias /biblioteca/;
    #     add_header Cache-Control "private, max-age=0";
    # }

    location / {
        proxy_pass http://alejandria;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_request_buffering on;   # el cuerpo entero a disco antes de Django
    }
}
