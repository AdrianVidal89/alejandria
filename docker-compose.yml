# Alejandria en el NAS Jupiter.
#
# Presupuesto de memoria (techos duros, no estimaciones):
#   web        288 MB  (Django + gunicorn, 1 worker)
#   vigilante   80 MB  (archiva lo que cae en el buzón)
#   nginx       24 MB  (estáticos y entrega de ficheros)
#   -----------------
#   total      392 MB  <- por debajo de los 400 MB de tope
#
# En reposo el consumo real ronda los 200-230 MB. Los techos están para que, si
# algo se desmadra, se reinicie Alejandria y no se lleve por delante a Treasure
# ni a PhotoPrism.

services:
  web:
    build: .
    container_name: alejandria-web
    restart: unless-stopped
    env_file: .env
    environment:
      - ALEJANDRIA_VIGILANTE=0        # el vigilante va en su propio contenedor
      - ALEJANDRIA_ACCEL=/interno/    # nginx entrega los ficheros, no Django
    volumes:
      - ${BIBLIOTECA:?define BIBLIOTECA en .env}:/biblioteca
      - ${ENTRADA:?define ENTRADA en .env}:/entrada
      - ./datos:/datos
      # Solo hace falta para importar de paperless (manage.py importar_paperless
      # /paperless). Descomenta, levanta, importa y vuelve a comentarlo. El «ro»
      # del final es solo-lectura: no puede modificar nada de paperless.
      # - ${PAPERLESS:-/dev/null}:/paperless:ro
    mem_limit: 288m
    memswap_limit: 288m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/estado/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  vigilante:
    build: .
    container_name: alejandria-vigilante
    restart: unless-stopped
    env_file: .env
    command: python manage.py vigilar
    volumes:
      - ${BIBLIOTECA:?}:/biblioteca
      - ${ENTRADA:?}:/entrada
      - ./datos:/datos
    mem_limit: 80m
    memswap_limit: 80m
    cpus: 0.5
    depends_on:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: alejandria-nginx
    restart: unless-stopped
    ports:
      - "${PUERTO:-8890}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${BIBLIOTECA:?}:/biblioteca:ro
      - ./datos/estaticos:/estaticos:ro
    mem_limit: 24m
    depends_on:
      - web
